<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-4 mb-4">     
    <div class="col">
        <div class="card metric-card">
            <div class="card-body">
                <div>
                    <span class="metric-label">Batches</span>
                    <h3 class="metric-value">{{ total_batches|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-collection-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card metric-card">
            <div class="card-body">
                <div>
                    <span class="metric-label">Assignments</span>
                    <h3 class="metric-value">{{ assignments|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card metric-card">
            <div class="card-body">
                <div>
                    <span class="metric-label">Courses</span>
                    <h3 class="metric-value">{{ total_courses|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-journal-bookmark-fill"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card metric-card">
            <div class="card-body">
                <div>
                    <span class="metric-label">Assignment Schemes</span>
                    <h3 class="metric-value">{{ total_schemes|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-filetype-json"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col">
        <div class="card metric-card">
            <div class="card-body">
                <div>
                    <span class="metric-label">Textbooks</span>
                    <h3 class="metric-value">{{ textbooks|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-book-half"></i>
                </div>
            </div>
        </div>
    </div>
</div>
