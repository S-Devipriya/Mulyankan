<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-3 mb-4">     
    <div class="col">
        <div class="card metric-card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-medium fs-7 text-uppercase tracking-wide">Batches</span>
                    <h3 class="fw-bold text-navy mt-1 mb-0">{{ total_batches|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-collection-fill"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card metric-card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-medium fs-7 text-uppercase tracking-wide">Assignments</span>
                    <h3 class="fw-bold text-navy mt-1 mb-0">{{ assignments|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-file-earmark-text-fill"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card metric-card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-medium fs-7 text-uppercase tracking-wide">Courses</span>
                    <h3 class="fw-bold text-navy mt-1 mb-0">{{ total_courses|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-journal-bookmark-fill"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card metric-card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-medium fs-7 text-uppercase tracking-wide">Assignment Schemes</span>
                    <h3 class="fw-bold text-navy mt-1 mb-0">{{ total_schemes|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-filetype-json"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card metric-card border-0 shadow-sm h-100">
            <div class="card-body d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-muted fw-medium fs-7 text-uppercase tracking-wide">Textbooks</span>
                    <h3 class="fw-bold text-navy mt-1 mb-0">{{ textbooks|default:0 }}</h3>
                </div>
                <div class="metric-icon-wrap">
                    <i class="bi bi-book-half"></i>
                </div>
            </div>
        </div>
    </div>
</div>
