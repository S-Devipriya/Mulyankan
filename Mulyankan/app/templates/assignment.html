{% extends 'base.html' %}

{% block title %}{% endblock %}

{% block content %}
<h2>Viewing Assignment for: {{ submission.enrollment_number }}</h2>
    {% if submission.file_path %}
        <iframe 
            src="{% url 'stream_assignment_pdf' submission.pk %}" 
            width="100%" 
            height="800px" 
            style="border: none;">
            <p>Your browser does not support inline PDFs. 
               <a href="{% url 'stream_assignment_pdf' submission.pk %}">Download here</a>.
            </p>
        </iframe>
    {% else %}
        <p>No PDF file uploaded for this submission.</p>
    {% endif %}
{% endblock %}
